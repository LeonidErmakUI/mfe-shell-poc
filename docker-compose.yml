services:
  mock-bff:
    build:
      context: ./packages/mock-bff
      dockerfile: Dockerfile
    ports:
      - "4000:4000"

  shell:
    build:
      context: .
      dockerfile: packages/shell/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_OKTA_ISSUER=https://integrator-1582367.okta.com/oauth2/default
      - VITE_OKTA_CLIENT_ID=0oa10akijfdtEWS6u698
      - VITE_BFF_URL=http://localhost:4000
    depends_on:
      - mock-bff

  workbench-marine:
    build:
      context: .
      dockerfile: packages/workbench-marine/Dockerfile
    ports:
      - "3001:3001"

  workbench-cyber:
    build:
      context: ./packages/workbench-cyber
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
